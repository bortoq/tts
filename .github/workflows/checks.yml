name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
        extras: ['dev']
        include:
          - python: '3.11'
            extras: 'dev,edge'
          - python: '3.11'
            extras: 'dev,silero'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install native playback tools
        run: sudo apt-get update && sudo apt-get install -y mpv ffmpeg
      - name: Report native versions
        run: mpv --version && ffmpeg -version
      - name: Install package and selected extras
        run: python -m pip install ".[${{ matrix.extras }}]"
      - name: Offline regression and real mpv tests
        run: python -m unittest discover -v
      - name: Lint
        run: python -m ruff check .
      - name: Build distributable
        run: python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/tts-wheel
          /tmp/tts-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/tts-wheel/bin/tts --help

  debian-mpv:
    runs-on: ubuntu-24.04
    container: python:3.13-slim-trixie
    steps:
      - name: Install Debian playback tools
        run: apt-get update && apt-get install -y --no-install-recommends git mpv ffmpeg
      - uses: actions/checkout@v4
      - name: Report native versions
        run: mpv --version && ffmpeg -version
      - run: python -m pip install ".[dev]"
      - name: Debian regression and real mpv tests
        run: python -m unittest discover -v
      - run: python -m ruff check .


  silero-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        torch: ['2.6.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU PyTorch
        env:
          TORCH_RELEASE: ${{ matrix.torch }}
        run: |
          if [ "$TORCH_RELEASE" = latest ]; then
            python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install "torch==$TORCH_RELEASE" --index-url https://download.pytorch.org/whl/cpu
          fi
      - run: python -m pip install ".[silero]"
      - name: Real model, diverse texts and reference equivalence
        run: python silero_regression.py --output /tmp/silero-corpus
      - name: Install Indic transliteration for routing checks
        if: matrix.torch == 'latest'
        run: python -m pip install ".[indic]"
      - name: All bundled language and speaker routes with real models
        if: matrix.torch == 'latest'
        run: python silero_routing_regression.py --output /tmp/silero-corpus/routing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silero-corpus-torch-${{ matrix.torch }}
          path: /tmp/silero-corpus
