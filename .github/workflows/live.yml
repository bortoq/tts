name: Live speech synthesis

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Network/model integration to run
        required: true
        type: choice
        options: [google, edge, silero]

permissions:
  contents: read

jobs:
  synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv
      - run: python -m pip install ".[edge,silero]"
      - name: Real synthesis, decoding and signal checks
        run: python integration_tests.py --engine "${{ inputs.engine }}" --timeout 120
